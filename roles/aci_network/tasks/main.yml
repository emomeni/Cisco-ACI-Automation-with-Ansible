---
- name: Ensure vrfs
  cisco.aci.aci_vrf:
    tenant: '{{ item[''tenant''] }}'
    vrf: '{{ item[''vrf''] }}'
    policy_control_preference: '{{ item[''policy_control_preference''] }}'
    policy_control_direction: '{{ item[''policy_control_direction''] }}'
    description: '{{ item[''description''] | default(omit) }}'
    state: present
  loop: '{{ aci_model.vrfs | default([]) }}'
  loop_control:
    label: '{{ item[''tenant''] }}'
  register: aci_step
  no_log: true
- name: Record vrfs results privately
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/report.yml'
  vars:
    aci_report_section: vrfs
- name: Assert no drift in vrfs
  ansible.builtin.assert:
    that:
      - not aci_step.changed
    fail_msg: Drift detected in vrfs; run the plan and inspect APIC.
  when: aci_verify | default(false) | bool
- name: Ensure bridge domains
  cisco.aci.aci_bd:
