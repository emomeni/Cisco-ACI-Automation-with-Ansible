---
- name: Ensure vlan pools
  cisco.aci.aci_vlan_pool:
    pool: '{{ item[''pool''] }}'
    pool_allocation_mode: '{{ item[''pool_allocation_mode''] }}'
    description: '{{ item[''description''] | default(omit) }}'
    state: present
  loop: '{{ aci_model.vlan_pools | default([]) }}'
  loop_control:
    label: '{{ item[''pool''] }}'
  register: aci_step
  no_log: true
- name: Record vlan_pools results privately
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/report.yml'
  vars:
    aci_report_section: vlan_pools
- name: Assert no drift in vlan pools
  ansible.builtin.assert:
    that:
      - not aci_step.changed
    fail_msg: Drift detected in vlan_pools; run the plan and inspect APIC.
  when: aci_verify | default(false) | bool
- name: Ensure vlan blocks
  cisco.aci.aci_vlan_pool_encap_block:
