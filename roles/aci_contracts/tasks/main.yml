---
- name: Ensure filters
  cisco.aci.aci_filter:
    tenant: '{{ item[''tenant''] }}'
    filter: '{{ item[''filter''] }}'
    description: '{{ item[''description''] | default(omit) }}'
    state: present
  loop: '{{ aci_model.filters | default([]) }}'
  loop_control:
    label: '{{ item[''tenant''] }}'
  register: aci_step
  no_log: true
- name: Record filters results privately
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/report.yml'
  vars:
    aci_report_section: filters
- name: Assert no drift in filters
  ansible.builtin.assert:
    that:
      - not aci_step.changed
    fail_msg: Drift detected in filters; run the plan and inspect APIC.
  when: aci_verify | default(false) | bool
- name: Ensure filter entries
  cisco.aci.aci_filter_entry:
    tenant: '{{ item[''tenant''] }}'
    filter: '{{ item[''filter''] }}'
    entry: '{{ item[''entry''] }}'
    ether_type: '{{ item[''ether_type''] }}'
    ip_protocol: '{{ item[''ip_protocol''] }}'
