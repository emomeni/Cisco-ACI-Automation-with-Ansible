---
- name: Ensure l3outs
  cisco.aci.aci_l3out:
    tenant: '{{ item[''tenant''] }}'
    l3out: '{{ item[''l3out''] }}'
    vrf: '{{ item[''vrf''] }}'
    domain: '{{ item[''domain''] }}'
    l3protocol: '{{ item[''l3protocol''] }}'
    route_control: '{{ item[''route_control''] }}'
    description: '{{ item[''description''] | default(omit) }}'
    state: present
  loop: '{{ aci_model.l3outs | default([]) }}'
  loop_control:
    label: '{{ item[''tenant''] }}'
  register: aci_step
  no_log: true
- name: Record l3outs results privately
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/report.yml'
  vars:
    aci_report_section: l3outs
- name: Assert no drift in l3outs
  ansible.builtin.assert:
    that:
      - not aci_step.changed
    fail_msg: Drift detected in l3outs; run the plan and inspect APIC.
  when: aci_verify | default(false) | bool
- name: Ensure l3out node profiles
