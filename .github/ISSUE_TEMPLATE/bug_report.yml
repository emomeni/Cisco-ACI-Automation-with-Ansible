---
name: Bug report
description: Report a reproducible problem with sanitized evidence.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: APIC, Python, ansible-core and cisco.aci versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized minimal model and reproduction steps
      description: Remove credentials, real addresses, tenant names and private audit data.
    validations:
      required: true
